name: Debug RealSR-NCNN-Android Build

on:
  workflow_dispatch:

env:
  UPSTREAM_TAG: "1.11.2"
  UPSTREAM_REPO: "tumuyan/RealSR-NCNN-Android"
  GUI_MODULE: "RealSR-NCNN-Android-GUI"

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream source at tag
        run: |
          curl -L -f -o source.zip "https://github.com/${UPSTREAM_REPO}/archive/refs/tags/${UPSTREAM_TAG}.zip"
          unzip -q source.zip
          mv RealSR-NCNN-Android-${UPSTREAM_TAG} src

      - name: Print official workflow files (ground truth)
        run: |
          echo "=== android.yml ==="
          cat src/.github/workflows/android.yml
          echo ""
          echo "=== libs.yml ==="
          cat src/.github/workflows/libs.yml
          echo ""
          echo "=== copy_cli_build_result.bat ==="
          cat "src/3rdparty/copy_cli_build_result.bat"
          echo ""
          echo "=== GUI app-level build.gradle ==="
          cat "src/${GUI_MODULE}/app/build.gradle"
          echo ""
          echo "=== GUI top-level build.gradle ==="
          cat "src/${GUI_MODULE}/build.gradle"
          echo ""
          echo "=== GUI settings.gradle ==="
          cat "src/${GUI_MODULE}/settings.gradle"

      - name: Upload debug info as artifact
        run: |
          mkdir -p debugout
          cp src/.github/workflows/android.yml debugout/ 2>/dev/null || true
          cp src/.github/workflows/libs.yml debugout/ 2>/dev/null || true
          cp "src/3rdparty/copy_cli_build_result.bat" debugout/ 2>/dev/null || true
          cp "src/${GUI_MODULE}/app/build.gradle" debugout/gui_app_build.gradle 2>/dev/null || true
          cp "src/${GUI_MODULE}/build.gradle" debugout/gui_build.gradle 2>/dev/null || true
          cp "src/${GUI_MODULE}/settings.gradle" debugout/gui_settings.gradle 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-info
          path: debugout/
