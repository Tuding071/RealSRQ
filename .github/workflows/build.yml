name: Build Modded RealSR-NCNN-Android (Auto Queue)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  UPSTREAM_TAG: "1.11.2"
  UPSTREAM_REPO: "tumuyan/RealSR-NCNN-Android"
  GUI_MODULE: "RealSR-NCNN-Android-GUI"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream source at tag
        run: |
          curl -L -f -o source.zip "https://github.com/${UPSTREAM_REPO}/archive/refs/tags/${UPSTREAM_TAG}.zip"
          unzip -q source.zip
          mv RealSR-NCNN-Android-${UPSTREAM_TAG} src

      - name: Download and unzip assets.zip
        run: |
          ASSET_URL="https://github.com/${UPSTREAM_REPO}/releases/download/${UPSTREAM_TAG}/assets.zip"
          FALLBACK_URL="https://github.com/${UPSTREAM_REPO}/releases/download/1.11.1/assets.zip"
          echo "Trying ${ASSET_URL}"
          curl -L -f -o assets.zip "$ASSET_URL" || {
            echo "1.11.2 assets.zip not found, falling back to 1.11.1"
            curl -L -f -o assets.zip "$FALLBACK_URL"
          }
          file assets.zip
          unzip -q assets.zip -d assets_extracted
          cp -rv assets_extracted/* src/RealSR-NCNN-Android-CLI/ || true

      - name: Write queue patch
        run: |
          P=queue.patch
          : > "$P"
          echo '--- a/RealSR-NCNN-Android-GUI/app/src/main/java/com/tumuyan/ncnn/realsr/MainActivity.java' >> "$P"
          echo '+++ b/RealSR-NCNN-Android-GUI/app/src/main/java/com/tumuyan/ncnn/realsr/MainActivity.java' >> "$P"
          echo '@@ -95,6 +95,10 @@ public class MainActivity extends AppCompatActivity {' >> "$P"
          echo '     private String outputSavePath = "";' >> "$P"
          echo '     private String inputFileName = "";' >> "$P"
          echo ' ' >> "$P"
          echo '+    // --- Auto Queue feature ---' >> "$P"
          echo '+    private final List<Uri> autoQueue = new ArrayList<>();' >> "$P"
          echo '+    private int autoQueueIndex = 0;' >> "$P"
          echo '+' >> "$P"
          echo '     private String[] formats;' >> "$P"
          echo ' ' >> "$P"
          echo '     private String[] command = null;' >> "$P"
          echo '@@ -560,10 +564,15 @@ public class MainActivity extends AppCompatActivity {' >> "$P"
          echo '             } else if (requestCode == SELECT_MULTI_IMAGE) {' >> "$P"
          echo '                 List<Uri> imageUris = new ArrayList<>();' >> "$P"
          echo '                 ClipData clipData = data.getClipData();' >> "$P"
          echo '-                for (int i = 0; i < clipData.getItemCount(); i++) {' >> "$P"
          echo '-                    imageUris.add(clipData.getItemAt(i).getUri());' >> "$P"
          echo '+                if (clipData != null) {' >> "$P"
          echo '+                    for (int i = 0; i < clipData.getItemCount(); i++) {' >> "$P"
          echo '+                        imageUris.add(clipData.getItemAt(i).getUri());' >> "$P"
          echo '+                    }' >> "$P"
          echo '                 }' >> "$P"
          echo '-                handleSelectedImages(imageUris);' >> "$P"
          echo '+                autoQueue.clear();' >> "$P"
          echo '+                autoQueue.addAll(imageUris);' >> "$P"
          echo '+                autoQueueIndex = 0;' >> "$P"
          echo '+                processNextInAutoQueue();' >> "$P"
          echo '             }' >> "$P"
          echo ' ' >> "$P"
          echo '         }' >> "$P"
          echo '         super.onActivityResult(requestCode, resultCode, data);' >> "$P"
          echo '     }' >> "$P"
          echo ' ' >> "$P"
          echo '+    // Loads the next queued image via the normal single-image path,' >> "$P"
          echo '+    // then auto-triggers the same run logic as tapping "Run".' >> "$P"
          echo '+    private void processNextInAutoQueue() {' >> "$P"
          echo '+        if (autoQueueIndex >= autoQueue.size()) {' >> "$P"
          echo '+            autoQueue.clear();' >> "$P"
          echo '+            return;' >> "$P"
          echo '+        }' >> "$P"
          echo '+        Uri uri = autoQueue.get(autoQueueIndex);' >> "$P"
          echo '+        deleteFile(inputFile);' >> "$P"
          echo '+        inputFileName = getFileName(uri, this);' >> "$P"
          echo '+        if (inputFileName != null)' >> "$P"
          printf '%s\n' '+            inputFileName = inputFileName.replaceFirst("\\.[^.]+$", "");' >> "$P"
          echo '+        try {' >> "$P"
          echo '+            InputStream in = getContentResolver().openInputStream(uri);' >> "$P"
          echo '+            if (in != null) {' >> "$P"
          echo '+                saveInputImage(in, "");' >> "$P"
          echo '+                runOnUiThread(this::triggerRunClick);' >> "$P"
          echo '+            } else {' >> "$P"
          echo '+                autoQueueIndex++;' >> "$P"
          echo '+                processNextInAutoQueue();' >> "$P"
          echo '+            }' >> "$P"
          echo '+        } catch (Exception e) {' >> "$P"
          echo '+            e.printStackTrace();' >> "$P"
          echo '+            autoQueueIndex++;' >> "$P"
          echo '+            processNextInAutoQueue();' >> "$P"
          echo '+        }' >> "$P"
          echo '+    }' >> "$P"
          echo '+' >> "$P"
          echo '+    private void triggerRunClick() {' >> "$P"
          echo '+        View runBtn = findViewById(R.id.btn_run);' >> "$P"
          echo '+        if (runBtn != null)' >> "$P"
          echo '+            runBtn.performClick();' >> "$P"
          echo '+    }' >> "$P"
          echo '+' >> "$P"
          echo '@@ -820,6 +860,13 @@ public class MainActivity extends AppCompatActivity {' >> "$P"
          echo '                             if (!effectivelyFinalCmd.contains("output.png"))' >> "$P"
          echo '                                 imageView.setVisibility(View.GONE);' >> "$P"
          echo '                         }' >> "$P"
          echo '+' >> "$P"
          echo '+                        if (success && !autoQueue.isEmpty() && autoQueueIndex < autoQueue.size()) {' >> "$P"
          echo '+                            autoQueueIndex++;' >> "$P"
          echo '+                            if (autoQueueIndex < autoQueue.size()) {' >> "$P"
          echo '+                                processNextInAutoQueue();' >> "$P"
          echo '+                            } else {' >> "$P"
          echo '+                                autoQueue.clear();' >> "$P"
          echo '+                            }' >> "$P"
          echo '+                        }' >> "$P"
          echo '                             });' >> "$P"
          echo '                         }' >> "$P"
          cat "$P"

      - name: Apply queue patch
        run: |
          cd src
          git init -q
          git apply --verbose --recount ../queue.patch

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x src/gradlew

      - name: Build APK
        working-directory: src
        run: ./gradlew :${GUI_MODULE}:app:assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RealSR-NCNN-Android-AutoQueue-${{ env.UPSTREAM_TAG }}
          path: src/${{ env.GUI_MODULE }}/app/build/outputs/apk/release/*.apk
