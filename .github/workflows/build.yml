name: Build Modded RealSR-NCNN-Android (Full CLI + Auto Queue)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  UPSTREAM_TAG: "1.11.2"
  UPSTREAM_REPO: "tumuyan/RealSR-NCNN-Android"
  GUI_MODULE: "RealSR-NCNN-Android-GUI"
  CLI_MODULE: "RealSR-NCNN-Android-CLI"
  TARGET_FILE: "RealSR-NCNN-Android-GUI/app/src/main/java/com/tumuyan/ncnn/realsr/MainActivity.java"
  NCNN_URL: "https://github.com/Tencent/ncnn/releases/download/20221128/ncnn-20221128-android-vulkan-shared.zip"
  NCNN_NAME: "ncnn-20221128-android-vulkan-shared.zip"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (for the modded MainActivity.java)
        uses: actions/checkout@v4

      - name: Checkout upstream source at tag
        run: |
          curl -L -f -o source.zip "https://github.com/${UPSTREAM_REPO}/archive/refs/tags/${UPSTREAM_TAG}.zip"
          unzip -q source.zip
          mv RealSR-NCNN-Android-${UPSTREAM_TAG} src

      - name: Download NCNN shared libs
        run: |
          wget -q "$NCNN_URL" -O "$NCNN_NAME"
          mkdir -p src/3rdparty/ncnn-android-vulkan-shared
          unzip -o "$NCNN_NAME" -d src/3rdparty/ncnn-android-vulkan-shared

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1" > /dev/null

      - name: Build all CLI submodules
        working-directory: src/${{ env.CLI_MODULE }}
        run: |
          chmod +x gradlew
          for module in Anime4k MNN-SR RealSR RealCUGAN SRMD Waifu2x Resize; do
            echo "=== Building $module ==="
            ./gradlew ":${module}:assembleRelease" || echo "!!! $module build failed, continuing !!!"
          done

      - name: List CLI build outputs (debug)
        run: |
          find src/${{ env.CLI_MODULE }} -path "*merged_native_libs*" -o -path "*mergeReleaseNativeLibs*" | head -50

      - name: Copy CLI build outputs into GUI assets (mirrors copy_cli_build_result.bat)
        run: |
          TARGET_DIR="src/${GUI_MODULE}/app/src/main/assets/realsr"
          mkdir -p "$TARGET_DIR"
          for module in Anime4k MNN-SR RealSR RealCUGAN SRMD Waifu2x Resize; do
            SRC_LIB_DIR="src/${CLI_MODULE}/${module}/build/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib/arm64-v8a"
            if [ -d "$SRC_LIB_DIR" ]; then
              echo "Copying from $SRC_LIB_DIR"
              cp -v "$SRC_LIB_DIR"/* "$TARGET_DIR"/ 2>/dev/null || true
            else
              echo "!!! Missing expected output dir for $module: $SRC_LIB_DIR"
            fi
          done
          cp -v src/3rdparty/ncnn-android-vulkan-shared/arm64-v8a/lib/libncnn.so "$TARGET_DIR"/ 2>/dev/null || echo "!!! libncnn.so not found at expected path"

          echo ""
          echo "=== Final assets/realsr contents ==="
          ls -la "$TARGET_DIR"

      - name: Overwrite MainActivity.java with modded version
        run: |
          cp -v patches/MainActivity.java "src/${TARGET_FILE}"

      - name: Build Gui
        run: |
          cd "src/${GUI_MODULE}" && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RealSR-NCNN-Android-AutoQueue-${{ env.UPSTREAM_TAG }}
          path: src/${{ env.GUI_MODULE }}/app/build/outputs/apk/**/*.apk
