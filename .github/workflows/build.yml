name: Build Modded RealSR-NCNN-Android (Auto Queue + PiP)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  UPSTREAM_TAG: "1.11.2"
  UPSTREAM_REPO: "tumuyan/RealSR-NCNN-Android"
  GUI_MODULE: "RealSR-NCNN-Android-GUI"
  TARGET_JAVA: "RealSR-NCNN-Android-GUI/app/src/main/java/com/tumuyan/ncnn/realsr/MainActivity.java"
  TARGET_MANIFEST: "RealSR-NCNN-Android-GUI/app/src/main/AndroidManifest.xml"
  ASSETS_URL: "https://github.com/tumuyan/RealSR-NCNN-Android/releases/download/1.11.1/assets.zip"
  NCNN_URL: "https://github.com/Tencent/ncnn/releases/download/20221128/ncnn-20221128-android-vulkan-shared.zip"
  NCNN_NAME: "ncnn-20221128-android-vulkan-shared.zip"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (for the modded MainActivity.java and AndroidManifest.xml)
        uses: actions/checkout@v4

      - name: Checkout upstream source at tag
        run: |
          curl -L -f -o source.zip "https://github.com/${UPSTREAM_REPO}/archive/refs/tags/${UPSTREAM_TAG}.zip"
          unzip -q source.zip
          mv RealSR-NCNN-Android-${UPSTREAM_TAG} src

      - name: Download NCNN and Assets
        run: |
          ASSET_URL="$ASSETS_URL"
          echo "Trying ${ASSET_URL}"
          curl -L -f -o assets.zip "$ASSET_URL"
          wget -q "$NCNN_URL" -O "$NCNN_NAME"

          file assets.zip

          mkdir -p assets_tmp
          unzip -o assets.zip -d assets_tmp
          mkdir -p "src/${GUI_MODULE}/app/src/main/assets"
          cp -rv assets_tmp/assets/* "src/${GUI_MODULE}/app/src/main/assets/"

          mkdir -p src/3rdparty
          unzip -o "$NCNN_NAME" -d src/3rdparty/ncnn-android-vulkan-shared

      - name: Verify assets landed correctly
        run: |
          echo "=== assets/realsr contents (should NOT have a nested assets/ folder) ==="
          ls -la "src/${GUI_MODULE}/app/src/main/assets/realsr" | head -30

      - name: Overwrite MainActivity.java and AndroidManifest.xml with modded versions
        run: |
          cp -v patches/MainActivity.java "src/${TARGET_JAVA}"
          cp -v patches/AndroidManifest.xml "src/${TARGET_MANIFEST}"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Gui
        run: |
          cd "src/${GUI_MODULE}" && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RealSR-NCNN-Android-AutoQueue-PiP-${{ env.UPSTREAM_TAG }}
          path: src/${{ env.GUI_MODULE }}/app/build/outputs/apk/**/*.apk
